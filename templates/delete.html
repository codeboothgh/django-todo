{% extends 'layout.html' %}
{% block title %}Delete Todo?{% endblock title %}
{% block content %}
    <div class="container d-flex flex-column gap-1 mt-4">
        <p>Are you sure you want to delete <strong>{{ todo.name }}</strong>?</p>
        <form action="{% url 'task:delete' todo.id %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes! Delete it.</button>
        </form>
    </div>
{% endblock content %}
