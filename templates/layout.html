{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Todo App</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> -->
</head>

<body>
    {% if messages %}
    {% for message in messages %}
    <div class="toast-container top-0 end-0 z-3 p-3">
        <div class="toast show fade bg-white" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Alert</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                {{message}}
            </div>
        </div>
    </div>
    {% endfor %}
    {% endif %}
    
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brand" href="/">Todos</a>
            <div class="d-flex gap-2 align-items-center">
                {% if user.is_authenticated %}

                <span>{{user.get_full_name}}</span>
                <a href="/user/logout/" class="btn btn-primary">
                    Logout
                </a>
                {% else %}
                <a href="/user/login/" class="btn btn-primary">
                    Login
                </a>
                <a href="/user/sign-up/" class="btn btn-secondary">Sign up</a>
                {% endif %}
            </div>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}"></script>
</body>

</html>
