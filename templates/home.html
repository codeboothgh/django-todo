{% extends "layout.html" %}
{% block content %}
<div class="container mt-4 d-flex flex-column gap-2">
    <div class="d-flex justify-content-end">
        <a href="{% url 'task:create' %}" class="btn btn-primary">Create Todo</a>
    </div>
    <ul class="list-group list-group-flush">
        {% for todo in todos %}
        <li class="list-group-item d-flex align-items-center gap-3">
            <span class="avatar">AB</span>
            <div class="d-flex flex-column gap-1 flex-grow-1">
                <div class="d-flex">
                    <span class="fw-bold flex-grow-1">{{todo.name}}</span>
                    <small style="width: fit-content; text-wrap: nowrap;">{{todo.created_at}}</small>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span>
                        <button class="btn btn-sm btn-light">{{todo.get_reaction_count}} Reactions</button> | <button class="btn btn-sm btn-light">{{todo.get_comment_count}} Comments</button>
                    </span>
                    <div class="d-flex gap-1">
                        <a class="btn btn-sm btn-outline-primary">View</a>
                        {% if todo.created_by == user %}
                            <a class="btn btn-sm btn-outline-secondary">Edit</a>
                            <a class="btn btn-sm btn-outline-danger">Delete</a>
                        {% endif %}
                    </div>
                </div>
            </div>

        </li>
        {% empty %}
        {% endfor %}
</div>
</div>
{% endblock content %}
